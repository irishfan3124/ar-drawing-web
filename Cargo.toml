[package]
name = "ar_drawing"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.16"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
